# ==============================================================================
# SAIN (Structure-Aware Image Inpainting) 配置文件
# 当前阶段：第一阶段 - 训练边缘生成网络 (Edge Generation Network)
# ==============================================================================

MODE: 1             # 运行模式：1 为训练 (train)，2 为测试 (test)，3 为评估 (eval)
MODEL: 2            # 训练目标：1 代表先单独训练 Edge model (边缘网络)，2 为 Inpaint model，3 为联合训练
MASK: 3             # 掩码类型：0 无掩码，1 随机块，2 中心掩码，3 外部引入掩码(训练用3，测试用6)
SEED: 10            # 随机种子，保证实验的可复现性
GPU: [0]            # 使用的 GPU 编号，您的 RTX 3090 是单卡，所以填 [0]
AUGMENTATION_TRAIN: 0 # 是否使用额外的数据增强：0 代表不使用 (因为您的数据集已经做过 padding 和增强了)

# ==============================================================================
# 1. 训练集与测试集的文件列表路径 (绝对路径)
# ==============================================================================
# RGB 原图路径
TRAIN_INPAINT_IMAGE_FLIST: /data/chen/sain/checkpoint/train_images.flist
TEST_INPAINT_IMAGE_FLIST: /data/chen/sain/checkpoint/test_images.flist

# 掩码 (Mask) 路径
# 训练时使用混合难度的掩码，提升泛化能力
TRAIN_MASK_FLIST: /data/chen/sain/checkpoint/train_masks_medium.flist
TEST_MASK_FLIST: /data/chen/sain/checkpoint/test_masks_medium.flist

# 边缘图 (Edge Map) 路径
TRAIN_INPAINT_EDGE_FLIST: /data/chen/sain/checkpoint/train_edges.flist
TEST_INPAINT_EDGE_FLIST: /data/chen/sain/checkpoint/test_edges.flist

# ==============================================================================
# 2. 优化器与学习率设置 (严格遵循论文设定)
# ==============================================================================
LR: 0.0001                    # 初始学习率 (论文指出前 300k 次迭代为 1x10^-4)
D2G_LR: 0.1                   # 判别器(Discriminator)和生成器(Generator)的学习率比例
BETA1: 0.9                    # Adam 优化器的 Beta1 参数
BETA2: 0.999                  # Adam 优化器的 Beta2 参数
WD: 0                         # 权重衰减 (Weight Decay)
LR_Decay: 1                   # 学习率衰减率

# ==============================================================================
# 3. 训练核心超参数
# ==============================================================================
BATCH_SIZE: 2                 # 批量大小 (论文指出单卡 RTX 4090 训练时的 Batch size 为 2，您的 3090 显存为 24G，完全没问题)
INPUT_SIZE: 256               # 模型输入尺寸 (大豆叶片数据集已统一处理为 256x256)
MAX_ITERS: 450000             # 最大迭代次数 (为大豆叶片数据集设定为 450,000 次)

# ==============================================================================
# 4. 损失函数权重 (Loss Weights)
# ==============================================================================
L1_LOSS_WEIGHT: 1             # L1 像素重建损失权重 (控制基础的像素准确度)
STYLE_LOSS_WEIGHT: 250        # 风格损失权重 (控制纹理和色彩的自然过渡)
CONTENT_LOSS_WEIGHT: 0.1      # 感知/内容损失权重 (VGG特征，保留高级语义细节)
INPAINT_ADV_LOSS_WEIGHT: 0.01 # 对抗损失权重 (使用 GAN 让修复痕迹更逼真)
SSIM_LOSS_WEIGHT: 0.1         # 结构相似性损失权重 (保护叶片边缘的结构完整性)
FEATURE_MATCHING_LOSS_WEIGHT: 10 # 判别器特征匹配损失权重

# ==============================================================================
# 5. GAN 设置与日志/保存频率
# ==============================================================================
GAN_LOSS: lsgan               # GAN 的损失类型 (论文中明确指出采用 Least-squares GAN (LSGAN) 以提高稳定性)
GAN_POOL_SIZE: 0              # 假图像池大小 (常用于缓解 GAN 的模式崩溃，这里默认不开启)

SAVE_INTERVAL: 1000           # 每隔 1000 次迭代保存一次模型 (.pth 权重文件)
EVAL_INTERVAL: 1000           # 每隔 1000 次迭代在测试集上评估一次 (原配置为 0，建议开启，便于观察 PSNR 涨幅)
LOG_INTERVAL: 100             # 每隔 100 次迭代在终端打印一次当前 Loss 状态